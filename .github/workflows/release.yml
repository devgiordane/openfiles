name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm run build && npm test

      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - run: npx vsce package --readme-path README.marketplace.md -o openfiles.vsix

      # Marketplace global PATs stop working on 2026-12-01; this uses Microsoft Entra ID via azure/login.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath openfiles.vsix --azure-credential

      - name: Publish to Open VSX
        run: npx ovsx publish openfiles.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - uses: softprops/action-gh-release@v2
        with:
          files: openfiles.vsix
          generate_release_notes: true
