name: Feature request
description: An idea that would make reviewing agent work easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's annoying or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
